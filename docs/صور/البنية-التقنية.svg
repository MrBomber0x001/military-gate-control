<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
  <title id="title">البنية التقنية للنظام</title>
  <desc id="desc">مخطط يبين متصفح المستخدم متصلاً بخادم مركزي يحتوي على واجهة ويب وقاعدة SQLite ونسخ احتياطية.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:Tahoma,Arial,sans-serif;fill:#0f172a}
      .title{font-size:28px;font-weight:700}
      .label{font-size:18px;font-weight:700}
      .small{font-size:15px;fill:#475569}
      .box{stroke-width:2;rx:18}
      .link{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="580" fill="#f8fafc"/>
  <text x="550" y="52" text-anchor="middle" class="title">بنية التحكم في البوابات</text>
  <rect x="65" y="220" width="250" height="100" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190" y="258" text-anchor="middle" class="label">متصفح المستخدم</text>
  <text x="190" y="287" text-anchor="middle" class="small">واجهة الويب</text>

  <rect x="420" y="205" width="300" height="150" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="570" y="250" text-anchor="middle" class="label">الخادم المركزي</text>
  <text x="570" y="282" text-anchor="middle" class="small">Node.js + Express</text>
  <text x="570" y="310" text-anchor="middle" class="small">جلسات وصلاحيات وواجهات API</text>
  <path d="M315 270h105" class="link"/>

  <rect x="805" y="105" width="230" height="110" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="920" y="146" text-anchor="middle" class="label">SQLite</text>
  <text x="920" y="176" text-anchor="middle" class="small">السجلات والمرفقات</text>
  <rect x="805" y="340" width="230" height="110" class="box" fill="#fee2e2" stroke="#ef4444"/>
  <text x="920" y="381" text-anchor="middle" class="label">مجلد النسخ</text>
  <text x="920" y="411" text-anchor="middle" class="small">يومية ويدوية وما قبل الاستعادة</text>
  <path d="M720 245h45q20 0 20-20v-45h20M720 315h45q20 0 20 20v45h20" class="link"/>

  <rect x="225" y="500" width="650" height="48" rx="12" fill="#fff7ed" stroke="#fb923c"/>
  <text x="550" y="531" text-anchor="middle" class="small">قاعدة البيانات والنسخ محفوظة مركزيًا على الخادم</text>
</svg>
