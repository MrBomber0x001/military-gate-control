<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>التحكم في البوابات — لوحة العمليات</title>
<link href="/app.css" rel="stylesheet">
<script>
  const savedTheme=localStorage.getItem('theme');
  if(savedTheme==='dark'||(savedTheme!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
</script>
<style>
 html,body{height:100%;font-family:Cairo,Tahoma,sans-serif}
 .fade-in{animation:fade .18s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion:reduce){.fade-in{animation:none}}
 .daily-report-body{display:grid;gap:1.25rem}
 .daily-report-date{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;border:1px solid #bfdbfe;border-radius:1rem;background:linear-gradient(120deg,#eff6ff,#fff);padding:1rem 1.25rem}
 .daily-report-date strong{border-radius:.75rem;background:#1d4ed8;padding:.4rem .8rem;color:white;font-size:1.25rem;letter-spacing:.04em}
 .daily-report-section{overflow:hidden;border:1px solid #e2e8f0;border-radius:1rem;background:white}
 .daily-report-section h3{display:flex;align-items:center;gap:.65rem;border-bottom:1px solid #e2e8f0;background:#f8fafc;padding:.75rem 1rem;font-weight:700}
 .daily-report-icon{display:grid;width:2rem;height:2rem;place-items:center;border-radius:.65rem;background:#dbeafe}
 .daily-report-count{margin-inline-start:auto;border-radius:999px;background:#e2e8f0;padding:.1rem .6rem;font-size:.8rem}
 .daily-report-section ul{display:grid;gap:.25rem;padding:.5rem 1rem 1rem}
 .daily-report-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.65rem;border-bottom:1px solid #f1f5f9;padding:.8rem .25rem;line-height:2}
 .daily-report-row:last-child{border-bottom:0}
 .daily-report-empty{padding:.75rem .25rem;color:#64748b}
 .dark .daily-report-date{border-color:#1e3a8a;background:linear-gradient(120deg,#172554,#0f172a)}
 .dark .daily-report-section{border-color:#334155;background:#0f172a}
 .dark .daily-report-section h3{border-color:#334155;background:#1e293b}
 .dark .daily-report-icon{background:#1e3a8a}
 .dark .daily-report-count{background:#334155}
 .dark .daily-report-row{border-color:#1e293b}
 .dark .daily-report-empty{color:#94a3b8}
 @media print{#sidebar,header,#toast,#drawer,.no-print{display:none!important}#content{padding:0!important}body{background:#fff!important;color:#000!important}.print-card{border:0!important;box-shadow:none!important}body.print-daily-report .movement-report{display:none!important}body.print-daily-report .daily-report-card{display:block!important}.daily-report-date,.daily-report-section,.daily-report-section h3{background:#fff!important;color:#000!important;border-color:#bbb!important}.daily-report-icon,.daily-report-count{background:#eee!important;color:#000!important}.daily-report-row{border-color:#ddd!important}}
</style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
<div class="flex min-h-screen">
  <aside id="sidebar" class="fixed inset-y-0 end-0 z-40 hidden w-72 max-w-[85vw] shrink-0 flex-col border-e border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-xl md:static md:z-auto md:flex md:w-64 md:max-w-none md:shadow-none">
    <div class="flex items-center gap-3 px-5 h-16 border-b border-slate-200 dark:border-slate-800">
      <div class="grid h-9 w-9 place-items-center rounded-xl bg-brand-600 text-white font-bold">ب</div>
      <div><div class="font-semibold leading-tight">التحكم في البوابات</div><div class="text-xs text-slate-500">لوحة العمليات</div></div>
    </div>
    <nav id="nav" class="flex-1 p-3 space-y-1 text-sm"></nav>
    <div class="p-3 border-t border-slate-200 dark:border-slate-800">
      <div class="flex items-center gap-3 p-2"><div id="meAv" class="grid h-9 w-9 place-items-center rounded-full bg-brand-100 text-brand-700 font-bold">؟</div>
        <div class="flex-1 min-w-0"><div id="meName" class="text-sm font-medium truncate"></div><div id="meRole" class="text-xs text-slate-500"></div></div>
        <button onclick="changePasswordForm()" aria-label="تغيير كلمة المرور" title="تغيير كلمة المرور" class="text-xs rounded-lg border border-slate-200 dark:border-slate-700 px-2 py-1 hover:bg-slate-100 dark:hover:bg-slate-800">🔑</button>
        <button onclick="logout()" class="text-xs rounded-lg border border-slate-200 dark:border-slate-700 px-2 py-1 hover:bg-slate-100 dark:hover:bg-slate-800">خروج</button></div>
    </div>
  </aside>
  <main class="flex-1 min-w-0 flex flex-col">
    <header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur px-4 md:px-6">
      <button id="menuBtn" aria-label="فتح القائمة" aria-controls="sidebar" aria-expanded="false" class="md:hidden grid h-9 w-9 place-items-center rounded-lg border border-slate-200 dark:border-slate-700">☰</button>
      <div class="relative flex-1 max-w-md">
        <input id="globalSearch" placeholder="ابحث بالاسم أو الرقم أو اللوحة…" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 py-2 ps-9 pe-4 text-sm outline-none focus:ring-2 ring-brand-500/40"/>
        <span class="absolute start-3 top-2.5 text-slate-400">🔍</span>
      </div>
      <div class="ms-auto flex items-center gap-2">
        <button id="inboxNotifications" onclick="run(openInboxNotifications)" aria-label="إشعاراتي" title="إشعاراتي" class="relative h-9 rounded-xl border border-slate-200 dark:border-slate-700 px-3 hover:bg-slate-100 dark:hover:bg-slate-800">
          🔔 <span id="inboxNotificationBadge" class="hidden absolute -top-2 -end-2 min-w-5 rounded-full bg-rose-600 px-1 text-xs leading-5 text-white"></span>
        </button>
        <button id="adminNotifications" onclick="run(openAdminNotifications)" aria-label="إشعارات المدير" class="hidden relative h-9 rounded-xl border border-slate-200 dark:border-slate-700 px-3 hover:bg-slate-100 dark:hover:bg-slate-800">
          🔔 <span id="notificationBadge" class="hidden absolute -top-2 -end-2 min-w-5 rounded-full bg-rose-600 px-1 text-xs leading-5 text-white"></span>
        </button>
        <select id="gateSel" aria-label="البوابة" class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm"></select>
        <input id="dateInput" type="date" aria-label="التاريخ" class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm"/>
        <button id="themeBtn" aria-label="تبديل الوضع" class="grid h-9 w-9 place-items-center rounded-xl border border-slate-200 dark:border-slate-700">🌙</button>
      </div>
    </header>
    <div id="content" class="flex-1 p-4 md:p-6 space-y-6"></div>
    <footer class="border-t border-slate-200 dark:border-slate-800 px-4 py-4 text-center text-sm text-slate-500 dark:text-slate-400">
      Made by —
      <a href="http://www.linkedin.com/in/yousef-meska" target="_blank" rel="noopener noreferrer" class="font-medium text-brand-600 hover:underline dark:text-brand-100">Yousef Meska</a>
    </footer>
  </main>
</div>
<div id="mobileNavBackdrop" class="fixed inset-0 z-30 hidden bg-black/40 md:hidden" aria-hidden="true"></div>
<div id="drawer" class="fixed inset-0 z-40 hidden">
  <div class="absolute inset-0 bg-black/40" onclick="closeDrawer()"></div>
  <div class="absolute end-0 top-0 h-full w-full max-w-md bg-white dark:bg-slate-900 border-s border-slate-200 dark:border-slate-800 p-5 overflow-y-auto">
    <div class="flex items-center justify-between mb-4"><h3 id="drawerTitle" class="text-lg font-semibold"></h3>
      <button onclick="closeDrawer()" aria-label="إغلاق" class="rounded-lg px-2 py-1 hover:bg-slate-100 dark:hover:bg-slate-800">✕</button></div>
    <div id="drawerBody" class="space-y-3 text-sm"></div>
  </div>
</div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden rounded-xl bg-slate-900 text-white px-4 py-2 text-sm shadow-lg"></div>

<script>
const pad=n=>String(n).padStart(2,'0'),D=new Date();
const today=`${D.getFullYear()}-${pad(D.getMonth()+1)}-${pad(D.getDate())}`;
const localDateTime=`${today}T${pad(D.getHours())}:${pad(D.getMinutes())}`;
const state={page:'dashboard',date:today,search:'',tab:'officers',from:today,to:today,reportFrom:today,reportTo:today,dailyReportDate:today,reportGate:'',reportSection:'',correspondenceFrom:'',correspondenceTo:'',correspondenceKind:'',correspondenceStatus:'',correspondenceSection:''};
dateInput.value=today;
let ME,PEOPLE=[],VISITOR_SUGGESTIONS=[],VISITOR_DEFAULT_SUGGESTIONS=[],visitorSuggestionTimer;

// ---------- helpers ----------
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ar=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const money=c=>ar((c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}))+' ج.م';
const MOVE={IN:'دخول',OUT:'خروج'},KIND={personnel:'🧑 أفراد',vehicle:'🚗 مركبات'};
async function api(u,body,method){
  const o={method:method||(body?'POST':'GET')};if(body){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(body)}
  const r=await fetch('/api/'+u,o),j=await r.json().catch(()=>({}));
  if(r.status===401){location.href='/login.html';throw new Error('انتهت الجلسة')}
  if(!r.ok)throw new Error(j.error||'حدث خطأ غير متوقع');return j}
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2400)};
let correspondenceMessagesInterval=null,activeCorrespondenceChat=null;
const stopCorrespondenceMessagesRefresh=()=>{if(correspondenceMessagesInterval){clearInterval(correspondenceMessagesInterval);correspondenceMessagesInterval=null}activeCorrespondenceChat=null};
const closeDrawer=()=>{stopCorrespondenceMessagesRefresh();document.getElementById('drawer').classList.add('hidden')};
const openDrawer=(t,h)=>{stopCorrespondenceMessagesRefresh();drawerTitle.textContent=t;drawerBody.innerHTML=h;drawer.classList.remove('hidden')};
const run=async fn=>{try{await fn()}catch(e){toast(e.message)}};
const isAdmin=()=>ME&&ME.role==='admin';
function changePasswordForm(){
  openDrawer('تغيير كلمة المرور',`<div><label class="text-xs font-medium" for="pw_current">كلمة المرور الحالية</label><input id="pw_current" type="password" autocomplete="current-password" class="${INP}"/></div>
    <div><label class="text-xs font-medium" for="pw_new">كلمة المرور الجديدة (٨ أحرف على الأقل)</label><input id="pw_new" type="password" autocomplete="new-password" class="${INP}"/></div>
    <div><label class="text-xs font-medium" for="pw_confirm">تأكيد كلمة المرور الجديدة</label><input id="pw_confirm" type="password" autocomplete="new-password" class="${INP}"/></div>
    <div class="pt-2">${btn('حفظ كلمة المرور','changeMyPassword()')}</div>`);
}
const changeMyPassword=()=>run(async()=>{
  const current_password=document.getElementById('pw_current').value,new_password=document.getElementById('pw_new').value,confirmPassword=document.getElementById('pw_confirm').value;
  if(new_password!==confirmPassword)throw new Error('كلمتا المرور الجديدتان غير متطابقتين');
  await api('auth/change-password',{current_password,new_password});
  closeDrawer();toast('تم تغيير كلمة المرور');
});

const INP='mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm';
const C={green:'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300',red:'bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300',gray:'bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-200',amber:'bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300',blue:'bg-brand-100 text-brand-700 dark:bg-brand-500/15 dark:text-brand-100'};
const tag=(t,c)=>`<span class="rounded-full px-2.5 py-1 text-xs font-semibold ${C[c]}">${t}</span>`;
const badge=t=>tag(MOVE[t],t==='IN'?'green':'red');
const status=i=>tag(i?'بالداخل':'بالخارج',i?'green':'gray');
const kpi=(l,v,s,a='')=>`<div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5"><div class="text-sm text-slate-500">${l}</div><div class="mt-1 text-3xl font-bold ${a}">${ar(v)}</div><div class="mt-1 text-xs text-slate-500">${s}</div></div>`;
const card=(t,a,b)=>`<section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900"><div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-800 px-5 py-4"><h2 class="font-semibold">${t}</h2><div class="flex flex-wrap gap-2">${a||''}</div></div><div class="p-5">${b}</div></section>`;
const table=(h,r)=>`<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-xs text-slate-500">${h.map(x=>`<th class="pb-3 pe-4 text-start font-medium">${x}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-800">${r}</tbody></table></div>`;
const btn=(l,o,s='primary')=>`<button onclick="${o}" class="rounded-xl px-3 py-2 text-sm font-medium transition ${{primary:'bg-brand-600 hover:bg-brand-700 text-white',ghost:'border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800',danger:'bg-rose-600 hover:bg-rose-700 text-white',ok:'border border-emerald-500 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-50 dark:hover:bg-emerald-500/10'}[s]}">${l}</button>`;
const empty=t=>`<div class="py-10 text-center text-slate-500">${t}</div>`;
const head=(t,s,a='')=>`<div class="flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-bold">${t}</h1><p class="text-sm text-slate-500">${s}</p></div><div class="flex gap-2">${a}</div></div>`;
const filt=(l,f)=>{const q=state.search.trim().toLowerCase();return q?l.filter(x=>f.some(k=>String(x[k]??'').toLowerCase().includes(q))):l};
const adminLink=()=>isAdmin()?'<a href="/admin.html" class="rounded-xl px-3 py-2 text-sm font-medium border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">⚙️ إدارة البيانات</a>':'';
const delBtn=path=>isAdmin()?btn('حذف',`adminDel('${path}')`,'danger'):'';
const adminDel=p=>confirm('تأكيد الحذف؟')&&run(async()=>{await api(p,null,'DELETE');toast('تم الحذف');render()});
function editTimestamp(kind,id,field,value,label){
  if(!value)return;
  const formatted=value.replace(' ','T').slice(0,16);
  openDrawer(`تعديل ${label}`,`<div class="rounded-xl bg-brand-50 dark:bg-brand-500/10 p-3 text-sm">اختر التاريخ والوقت الصحيحين لهذا الحدث.</div>
    <label class="block text-xs font-medium" for="eventTimestamp">التاريخ والوقت<input id="eventTimestamp" type="datetime-local" value="${esc(formatted)}" class="${INP}" required/></label>
    <div class="pt-2">${btn('حفظ التعديل',`saveTimestamp('${kind}',${id},'${field}')`)}</div>`);
}
const saveTimestamp=(kind,id,field)=>run(async()=>{
  const value=document.getElementById('eventTimestamp').value;
  if(!value)throw new Error('أدخل التاريخ والوقت');
  await api(`records/${kind}/${id}/time`,{field,value},'PUT');
  closeDrawer();toast('تم تعديل التاريخ والوقت');render();
});
const editTimestampButton=(kind,id,field,value,label)=>value
  ?`<span class="no-print">${btn('تعديل',`editTimestamp(${esc(JSON.stringify(kind))},${id},${esc(JSON.stringify(field))},${esc(JSON.stringify(value))},${esc(JSON.stringify(label))})`,'ghost')}</span>`:'';
const mvRows=l=>l.map(m=>`<tr><td class="py-3 pe-4">${KIND[m.kind]||m.kind}</td><td class="pe-4 font-medium">${esc(m.ref)}</td><td class="pe-4">${badge(m.type)}</td><td class="pe-4">${esc(m.destination||'—')}</td><td class="pe-4">${esc(m.details||'—')}</td><td class="pe-4 text-slate-500">${ar(m.ts.slice(0,16))}</td><td class="pe-4">${editTimestampButton('movement',m.id,'ts',m.ts,'الحركة')}</td><td class="pe-4 text-slate-500">${esc(m.gate||'—')}</td><td class="pe-4 text-slate-500">${esc(m.by)}</td></tr>`).join('');
const MVH=['القسم','المرجع','الحركة','الوجهة','بيانات إضافية','الوقت','تعديل الوقت','البوابة','بواسطة'];

// generic form drawer
function fld(f){const id='f_'+f.k,L=`<label class="text-xs font-medium" for="${id}">${f.l}</label>`,required=f.required?'required':'';
  if(f.o)return `<div>${L}<select id="${id}" ${required} class="${INP}">${f.o.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(f.v??'')?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
  return `<div>${L}<input id="${id}" type="${f.t||'text'}" value="${esc(f.v)}" ${required} ${f.list?`list="dl_${f.k}"`:''} class="${INP}"/>${f.list?`<datalist id="dl_${f.k}">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}</div>`}
function form(title,fields,onSave,label='حفظ'){
  window._save=()=>run(async()=>{const v={};fields.forEach(f=>v[f.k]=document.getElementById('f_'+f.k).value);if(fields.some(f=>f.required&&!v[f.k]))throw new Error('يرجى ملء الحقول المطلوبة');await onSave(v);closeDrawer();render()});
  openDrawer(title,fields.map(fld).join('')+`<div class="pt-2">${btn(label,'_save()')}</div>`)}
const pOpts=async()=>(await api('personnel?date='+state.date)).map(p=>[p.id,`${p.name} — ${p.rank}`]);
const notificationTypes={personnel:'الأفراد',vehicle:'المركبات',attendance:'التمام',duty:'النوبتجية',mission:'المأموريات',clinic:'العيادات',leave:'الإجازات',visitor:'الزيارات',correspondence:'المكاتبات',correspondence_message:'متابعة المكاتبات',squad:'الفرق',purchase:'المشتريات',lookup:'القوائم',user:'المستخدمون',task:'التكليفات'};
const notificationSound=new Audio('/notification.wav');
notificationSound.preload='auto';
let previousUnreadCount=null;
let previousInboxUnreadCount=null;
async function refreshAdminNotifications(){
  const data=await api('admin/notifications?limit=1'),badge=document.getElementById('notificationBadge');
  if(previousUnreadCount!==null&&data.unread>previousUnreadCount){
    notificationSound.currentTime=0;
    notificationSound.play().catch(e=>console.warn('Unable to play notification sound:',e));
  }
  previousUnreadCount=data.unread;
  badge.textContent=ar(data.unread);badge.classList.toggle('hidden',!data.unread);
}
async function refreshInboxNotifications(){
  const data=await api('notifications?limit=1'),badge=document.getElementById('inboxNotificationBadge');
  if(previousInboxUnreadCount!==null&&data.unread>previousInboxUnreadCount){
    notificationSound.currentTime=0;
    notificationSound.play().catch(e=>console.warn('Unable to play member notification sound:',e));
  }
  previousInboxUnreadCount=data.unread;
  badge.textContent=ar(data.unread);badge.classList.toggle('hidden',!data.unread);
}
async function openInboxNotifications(){
  const data=await api('notifications?limit=100');
  const rows=data.items.map(n=>`<article class="rounded-xl border border-slate-200 dark:border-slate-800 p-4 ${n.read_at?'opacity-75':'bg-brand-50 dark:bg-brand-500/10'}">
    <div class="flex flex-wrap items-start justify-between gap-2"><div><h4 class="font-semibold">${esc(n.title||n.summary)}</h4>
    <p class="mt-1 text-xs text-slate-500">من ${esc(n.actor_name)} • ${ar(n.created_at.slice(0,16))}</p></div>
    ${n.read_at?tag('مقروء','gray'):btn('تحديد كمقروء',`markInboxNotificationRead(${n.id})`,'ghost')}</div>
    <p class="mt-3 whitespace-pre-wrap text-sm leading-7">${esc(n.body||n.summary)}</p>
    ${n.related_id?`<div class="mt-3">${btn('فتح متابعة المكاتبة',`openCorrespondenceFromNotification(${n.id},${n.related_id})`,'ghost')}</div>`:''}</article>`).join('');
  const send=isAdmin()?btn('إرسال إشعار للأعضاء','run(memberNotificationForm)','primary'):'';
  const markAll=data.unread?btn('تحديد الكل كمقروء','markAllInboxNotificationsRead()','ghost'):'';
  openDrawer('إشعاراتي',`<div class="flex flex-wrap gap-2">${send}${markAll}</div>${rows||empty('لا توجد إشعارات موجهة إليك بعد.')}`);
}
async function memberNotificationForm(){
  const users=(await api('admin/users')).filter(user=>user.active&&user.role==='operator');
  if(!users.length)throw new Error('لا يوجد أعضاء نشطون لإرسال إشعار إليهم');
  openDrawer('إرسال إشعار للأعضاء',`<div><label class="text-xs font-medium" for="member_notification_recipient">إرسال إلى</label><select id="member_notification_recipient" class="${INP}"><option value="all">كل الأعضاء النشطين (${users.length})</option>${users.map(user=>`<option value="${user.id}">${esc(user.full_name||user.username)} — ${esc(user.username)}</option>`).join('')}</select></div>
    <div><label class="text-xs font-medium" for="member_notification_title">عنوان الإشعار</label><input id="member_notification_title" maxlength="150" required class="${INP}"/></div>

function readCorrespondenceFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({filename:file.name,mime_type:file.type,data:reader.result});
    reader.onerror=()=>reject(new Error(`تعذرت قراءة الملف: ${file.name}`));
    reader.readAsDataURL(file);
  });
}
const saveCorrespondence=()=>run(async()=>{
  const selectedFiles=Array.from(document.getElementById('corr_files').files);
  if(selectedFiles.length>3)throw new Error('يمكن إرفاق ٣ ملفات كحد أقصى');
  if(selectedFiles.some(file=>file.size>5*1024*1024))throw new Error('حجم كل مرفق يجب ألا يتجاوز ٥ ميجابايت');
  const subject=document.getElementById('corr_subject').value.trim(),date=document.getElementById('corr_date').value,due=document.getElementById('corr_due').value;
  if(!subject||!date)throw new Error('أدخل موضوع المكاتبة وتاريخها');
  if(due&&due<date)throw new Error('موعد المتابعة لا يمكن أن يسبق تاريخ المكاتبة');
  const attachments=await Promise.all(selectedFiles.map(readCorrespondenceFile));
  await api('correspondence',{
    kind:document.getElementById('corr_kind').value,
    reference_number:document.getElementById('corr_reference').value,
    correspondence_date:date,
    sender:document.getElementById('corr_sender').value,
    recipient:document.getElementById('corr_recipient').value,
    responsible_section:document.getElementById('corr_section').value,
    subject,summary:document.getElementById('corr_summary').value,
    assigned_user_id:document.getElementById('corr_assignee').value||null,
    due_date:due||null,attachments,
  });
  closeDrawer();toast('تم تسجيل المكاتبة');render();
});

async function refreshCorrespondenceMessages(id){
  if(activeCorrespondenceChat!==id||drawer.classList.contains('hidden'))return;
  const messages=await api(`correspondence/${id}/messages`),container=document.getElementById('corr_messages');
  if(!container||activeCorrespondenceChat!==id)return;
  const wasNearBottom=container.scrollHeight-container.scrollTop-container.clientHeight<48;
  container.innerHTML=messages.map(message=>`<article class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3">
    <div class="flex flex-wrap items-center justify-between gap-2"><span class="font-semibold">${esc(message.author_name)}</span><time class="text-xs text-slate-500">${ar(message.created_at.slice(0,16))}</time></div>

function searchVisitorSuggestions(value){
  clearTimeout(visitorSuggestionTimer);
  const query=value.trim();
  if(!query){
    VISITOR_SUGGESTIONS=VISITOR_DEFAULT_SUGGESTIONS;
    const list=document.getElementById('visitorNames');
    if(list)list.innerHTML=visitorSuggestionOptions();
    return;
  }
  visitorSuggestionTimer=setTimeout(()=>run(async()=>{
    const suggestions=await api(`visitors/suggestions?query=${encodeURIComponent(query)}`);
    const input=document.getElementById('visitor_name'),list=document.getElementById('visitorNames');
    if(!input||!list||input.value.trim()!==query)return;
    VISITOR_SUGGESTIONS=suggestions;
    list.innerHTML=visitorSuggestionOptions();
  }),180);
}
function applyVisitorSuggestion(){
  const name=document.getElementById('visitor_name').value.trim().toLocaleLowerCase();
  const visitor=VISITOR_SUGGESTIONS.find(item=>item.name.toLocaleLowerCase()===name);
  if(!visitor)return;
  document.getElementById('visitor_rank').value=visitor.rank;
  document.getElementById('visitor_unit').value=visitor.unit||'';
}

 async squads(){const l=filt(await api('squads?date='+state.date),['name']);
  const rows=l.map(s=>`<tr><td class="py-3 pe-4 font-medium">${esc(s.name)}</td><td class="pe-4">${ar(s.start_date)}</td><td class="pe-4">${ar(s.end_date)}</td><td class="pe-4">${ar(s.member_count)}</td><td class="pe-4"><div class="flex gap-2">${btn('الأفراد والحضور',`run(()=>manageSquad(${s.id}))`,'ghost')}${delBtn('admin/squads/'+s.id)}</div></td></tr>`).join('');
  return head('الفرق',`الفرق التدريبية الفعالة بتاريخ ${ar(state.date)}. تكوين الفرق وإضافة أفرادها من صفحة الأدمن؛ وسجّل الحضور أو الغياب، وما عداهما يُعد إجازة.`,adminLink())+card('سجل الفرق',`<span class="text-xs text-slate-500">${ar(l.length)} فرقة</span>`,l.length?table(['اسم الفرقة','بداية الفرقة','نهاية الفرقة','عدد الأفراد',''],rows):empty('لا توجد فرق فعالة في هذا التاريخ.'))},

 async purchases(){const d=await api(`purchases?from=${state.from}&to=${state.to}`);
  const bar=`<div class="flex flex-wrap items-end gap-3"><div><label class="text-xs font-medium" for="pf">من</label><input id="pf" type="date" value="${state.from}" onchange="state.from=this.value;render()" class="${INP}"/></div><div><label class="text-xs font-medium" for="pt">إلى</label><input id="pt" type="date" value="${state.to}" onchange="state.to=this.value;render()" class="${INP}"/></div></div>`;
  const recs=d.records.map(r=>`<section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-3">
   <div class="flex flex-wrap items-center justify-between gap-2"><div><div class="font-semibold">${esc(r.person)} <span class="text-xs font-normal text-slate-500">${esc(r.rank||'')}</span></div><div class="text-xs text-slate-500">${ar(r.date)} • بواسطة ${esc(r.by)}</div></div>${delBtn('admin/purchases/'+r.id)}</div>
   ${table(['الصنف','السعر','العدد','الإجمالي'],r.lines.map(l=>`<tr><td class="py-2 pe-4">${esc(l.item)}</td><td class="pe-4">${money(l.price_cents)}</td><td class="pe-4">${ar(l.qty)}</td><td class="pe-4 font-medium">${money(l.price_cents*l.qty)}</td></tr>`).join('')+`<tr><td colspan="3" class="pt-3 pe-4 font-semibold">إجمالي العسكري</td><td class="pt-3 font-bold">${money(r.total_cents)}</td></tr>`)}</section>`).join('');
  return head('المشتريات','ما اشتراه العسكري وأحضره معه عند خروجه.',btn('+ تسجيل مشتريات','purchaseForm()')+btn('تصدير CSV',"exportCSV('purchases')",'ghost'))+bar+
   (recs||empty('لا توجد مشتريات في هذه الفترة.'))+`<div class="flex items-center justify-between rounded-2xl bg-brand-600 text-white p-5"><span class="font-semibold">الإجمالي العام للفترة</span><span class="text-2xl font-bold">${money(d.total_cents)}</span></div>`},

 async movements(){const l=await api('movements?date='+state.date);
  return head('سجل الحركة',`حركة الأفراد والمركبات بتاريخ ${ar(state.date)}.`)+card('نشاط '+ar(state.date),btn('تصدير CSV','exportCSV()','ghost'),l.length?table(MVH,mvRows(l)):empty('لا توجد حركات في هذا التاريخ.'))},

 async reports(){
  const filters=new URLSearchParams({from:state.reportFrom,to:state.reportTo,gate:state.reportGate,section:state.reportSection});
  const [d,daily]=await Promise.all([api('reports/movements?'+filters.toString()),api(`reports/daily?date=${encodeURIComponent(state.dailyReportDate)}`)]);
  const gates=[...gateSel.options].map(o=>o.value).filter(Boolean);
  const gateOptions=`<option value="">كل البوابات</option>${gates.map(g=>`<option value="${esc(g)}" ${state.reportGate===g?'selected':''}>${esc(g)}</option>`).join('')}`;
  const sectionOptions=`<option value="">كل الأقسام</option><option value="personnel" ${state.reportSection==='personnel'?'selected':''}>الأفراد</option><option value="vehicle" ${state.reportSection==='vehicle'?'selected':''}>المركبات</option>`;
  const time=value=>value?`<time dir="ltr" class="inline-block rounded-lg bg-slate-100 dark:bg-slate-800 px-2 py-1 text-sm font-semibold">${ar(value.replace('T',' ').slice(0,16))}</time>`:'<span class="text-slate-500">لم يسجل</span>';
  const personLabel=(rank,name)=>`${esc(rank||'فرد')} / ${esc(name)}`;
  const editAction=(type,id,field,value,label)=>editTimestampButton(type,id,field,value,label);
  const departureLines=daily.leaves.departures.map(leave=>`<li class="daily-report-row"><span>${personLabel(leave.rank,leave.person)} أخذ إجازة بتاريخ ${time(leave.departed_at)} وسيعود يوم ${time(leave.expected_return_at||leave.end_date)}</span><span class="no-print flex flex-wrap gap-1">${editAction('leave',leave.id,'departed_at',leave.departed_at,'خروج الإجازة')}${editAction('leave',leave.id,'expected_return_at',leave.expected_return_at,'موعد العودة المتوقع')}</span></li>`).join('');
  const returnLines=daily.leaves.returns.map(leave=>`<li class="daily-report-row"><span>عاد ${personLabel(leave.rank,leave.person)} من الإجازة التي أخذها بتاريخ ${time(leave.departed_at)} وعاد في تمام ${time(leave.returned_at)}</span><span class="no-print flex flex-wrap gap-1">${editAction('leave',leave.id,'departed_at',leave.departed_at,'خروج الإجازة')}${editAction('leave',leave.id,'returned_at',leave.returned_at,'العودة من الإجازة')}</span></li>`).join('');
  const visitorLines=daily.visitors.map(visitor=>`<li class="daily-report-row"><span>${esc(visitor.rank)} (${esc(visitor.name)}) بتاريخ ${time(visitor.enter_ts)} وغادر بتاريخ ${time(visitor.exit_ts)}</span><span class="no-print flex flex-wrap gap-1">${editAction('visitor',visitor.id,'enter_ts',visitor.enter_ts,'دخول الزائر')}${editAction('visitor',visitor.id,'exit_ts',visitor.exit_ts,'خروج الزائر')}</span></li>`).join('');
  const clinicLines=daily.clinics.map(clinic=>`<li class="daily-report-row"><span>ذهب ${personLabel(clinic.rank,clinic.person)} إلى ${esc(clinic.hospital||'جهة العيادة')} بسبب ${esc(clinic.case_details)}، بتاريخ ${time(clinic.start_ts)} وعاد بتاريخ ${time(clinic.end_ts)}</span><span class="no-print flex flex-wrap gap-1">${editAction('clinic',clinic.id,'start_ts',clinic.start_ts,'الخروج للعيادة')}${editAction('clinic',clinic.id,'end_ts',clinic.end_ts,'العودة من العيادة')}</span></li>`).join('');
  const peopleLines=daily.people.map(person=>{
    const duty=daily.duty.find(item=>item.person_id===person.id);
    return `<li class="daily-report-row"><span>${personLabel(person.rank,person.name)} دخل ${time(person.entry_ts)} وخروج ${time(person.exit_ts)}${duty?` — وهو ${esc(duty.role_label)} الآن`:''}</span><span class="no-print flex flex-wrap gap-1">${editAction('movement',person.entry_id,'ts',person.entry_ts,'دخول الفرد')}${editAction('movement',person.exit_id,'ts',person.exit_ts,'خروج الفرد')}</span></li>`;
  }).join('');
  const dutyOnlyLines=daily.duty.filter(item=>!daily.people.some(person=>person.id===item.person_id))
    .map(item=>`<li class="daily-report-row"><span>${personLabel(item.rank,item.person)} — وهو ${esc(item.role_label)} الآن</span></li>`).join('');
  const dailyDateLabel=`${daily.date.slice(8,10)}/${daily.date.slice(5,7)}/${daily.date.slice(0,4)}`;
  const section=(title,icon,count,lines,emptyText)=>`<section class="daily-report-section"><h3><span class="daily-report-icon">${icon}</span><span>${title}</span><span class="daily-report-count">${ar(count)}</span></h3><ul>${lines||`<li class="daily-report-empty">${emptyText}</li>`}</ul></section>`;
  const dailyReport=`<div class="daily-report-body"><div class="daily-report-date"><span class="text-sm font-semibold text-slate-500">تقرير يوم</span><strong>${ar(dailyDateLabel)}</strong><span class="text-xs text-slate-500">التاريخ والوقت المحليان للنظام</span></div>
    ${section('الإجازات','🗓️',daily.leaves.departures.length+daily.leaves.returns.length,departureLines+returnLines,'لا توجد حركات إجازات اليوم.')}
    ${section('الزيارات','👤',daily.visitors.length,visitorLines,'لا توجد زيارات مسجلة اليوم.')}
    ${section('العيادات','🏥',daily.clinics.length,clinicLines,'لا توجد حالات عيادة مسجلة اليوم.')}
    ${section('الأفراد','🧑‍✈️',daily.people.length,peopleLines+dutyOnlyLines,'لا توجد حركات أفراد مسجلة اليوم.')}</div>`;
  const dailyDate=`<label class="text-xs font-medium" for="dailyReportDate">عرض تقرير تاريخ آخر<input id="dailyReportDate" type="date" value="${state.dailyReportDate}" onchange="state.dailyReportDate=this.value;render()" class="${INP}"/></label>`;
  const dailyReportCard=`<div class="daily-report-card print-card">${card('التقرير اليومي',`<div class="no-print flex flex-wrap items-end gap-3">${dailyDate}${btn('طباعة التقرير اليومي','printDailyReport()','ghost')}</div>`,dailyReport)}</div>`;
  const filterBar=`<div class="report-filters no-print flex flex-wrap items-end gap-3 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
   <div><label class="text-xs font-medium" for="reportFrom">من تاريخ</label><input id="reportFrom" type="date" value="${state.reportFrom}" onchange="state.reportFrom=this.value;render()" class="${INP}"/></div>
   <div><label class="text-xs font-medium" for="reportTo">إلى تاريخ</label><input id="reportTo" type="date" value="${state.reportTo}" onchange="state.reportTo=this.value;render()" class="${INP}"/></div>
   <div><label class="text-xs font-medium" for="reportGate">البوابة</label><select id="reportGate" onchange="state.reportGate=this.value;render()" class="${INP}">${gateOptions}</select></div>
   <div><label class="text-xs font-medium" for="reportSection">القسم</label><select id="reportSection" onchange="state.reportSection=this.value;render()" class="${INP}">${sectionOptions}</select></div>
  </div>`;
  const query=`from=${encodeURIComponent(state.reportFrom)}&to=${encodeURIComponent(state.reportTo)}&gate=${encodeURIComponent(state.reportGate)}&section=${encodeURIComponent(state.reportSection)}`;
  return dailyReportCard+`<div class="movement-report space-y-6">`+
   head('التقارير',`حركة الفترة من ${ar(state.reportFrom)} إلى ${ar(state.reportTo)} • ${esc(d.gate)} • ${esc(d.section)}`,
    `<span class="no-print">${btn('تصدير Excel',`location.href='/api/reports/movements.xlsx?${query}'`)} ${btn('طباعة تقرير الحركة','window.print()','ghost')}</span>`)+filterBar+
   `<div class="grid gap-4 sm:grid-cols-3">${kpi('إجمالي الحركات',d.total,'حسب الفلاتر المحددة')}${kpi('الدخول',d.entries,'أفراد ومركبات','text-emerald-600')}${kpi('الخروج',d.exits,'أفراد ومركبات','text-rose-600')}</div>`+
   `<div class="print-card">${card('تفاصيل الحركات',`${ar(d.total)} حركة`,d.rows.length?table(MVH,mvRows(d.rows)):empty('لا توجد حركات مطابقة للفلاتر.'))}</div></div>`
 }
};
async function render(){const c=document.getElementById('content');
  try{c.innerHTML=`<div class="fade-in space-y-6">${await pages[state.page]()}</div>`}catch(e){c.innerHTML=empty('تعذّر تحميل البيانات: '+esc(e.message))}}

dateInput.addEventListener('change',e=>{if(!e.target.value)return;state.date=state.from=state.to=e.target.value;render()});
let st;globalSearch.addEventListener('input',e=>{state.search=e.target.value;clearTimeout(st);st=setTimeout(()=>['personnel','vehicles','missions','clinics','leaves','visitors','correspondence','squads','tasks'].includes(state.page)&&render(),150)});
const setTheme=(dark,persist=true)=>{
  document.documentElement.classList.toggle('dark',dark);
  if(persist)localStorage.setItem('theme',dark?'dark':'light');
  themeBtn.textContent=dark?'☀️':'🌙';
  themeBtn.setAttribute('aria-label',dark?'تفعيل الوضع الفاتح':'تفعيل الوضع الداكن');
  themeBtn.title=dark?'تفعيل الوضع الفاتح':'تفعيل الوضع الداكن';
};
setTheme(document.documentElement.classList.contains('dark'),false);
themeBtn.addEventListener('click',()=>setTheme(!document.documentElement.classList.contains('dark')));
function openMobileNav(){
  sidebar.classList.remove('hidden');sidebar.classList.add('flex');
  mobileNavBackdrop.classList.remove('hidden');
  menuBtn.setAttribute('aria-expanded','true');menuBtn.setAttribute('aria-label','إغلاق القائمة');
  document.body.classList.add('overflow-hidden');
}
function closeMobileNav(){
  if(innerWidth>=768){sidebar.classList.remove('flex');sidebar.classList.add('hidden')}
  else{sidebar.classList.add('hidden');sidebar.classList.remove('flex')}
  mobileNavBackdrop.classList.add('hidden');
  menuBtn.setAttribute('aria-expanded','false');menuBtn.setAttribute('aria-label','فتح القائمة');
  document.body.classList.remove('overflow-hidden');
}
menuBtn.addEventListener('click',()=>menuBtn.getAttribute('aria-expanded')==='true'?closeMobileNav():openMobileNav());
mobileNavBackdrop.addEventListener('click',closeMobileNav);
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&menuBtn.getAttribute('aria-expanded')==='true')closeMobileNav()});
const logout=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login.html'};
(async()=>{
 try{ME=await api('me');const LK=await api('lookups'),nm=ME.full_name||ME.username;
  meName.textContent=nm;meAv.textContent=nm[0];meRole.textContent=isAdmin()?'مدير النظام':'مشغّل بوابة';
  if(isAdmin())meRole.insertAdjacentHTML('afterend','<a href="/admin.html" class="block text-xs text-brand-600">⚙️ إدارة البيانات</a>');
  gateSel.innerHTML=LK.gate.map(g=>`<option>${esc(g.name)}</option>`).join('');
  gateSel.value=localStorage.getItem('gate')||'';if(!gateSel.value)gateSel.selectedIndex=0;
  gateSel.onchange=()=>localStorage.setItem('gate',gateSel.value);
  if(isAdmin()){
    adminNotifications.classList.remove('hidden');
    refreshAdminNotifications().catch(e=>console.error('Unable to refresh admin notifications:',e));
    setInterval(()=>refreshAdminNotifications().catch(e=>console.error('Unable to refresh admin notifications:',e)),15000);
  }
  refreshInboxNotifications().catch(e=>console.error('Unable to refresh member notifications:',e));
  setInterval(()=>refreshInboxNotifications().catch(e=>console.error('Unable to refresh member notifications:',e)),15000);
 }catch(e){return}
 renderNav();render();
})();
</script>
