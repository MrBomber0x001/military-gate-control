<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"/>
  <title>الاتصال بالخادم — التحكم في البوابات</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f1f5f9;color:#1e293b;font-family:Cairo,Tahoma,Arial,sans-serif}
    main{width:min(100%,480px);padding:28px;border:1px solid #e2e8f0;border-radius:20px;background:#fff;box-shadow:0 20px 40px #0f172a14}
    h1{margin:0 0 8px;font-size:22px}p{margin:0 0 22px;color:#64748b;line-height:1.8}
    label{display:block;margin-bottom:8px;font-weight:600}
    input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;direction:ltr;text-align:left}
    button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:12px;background:#2f5bc4;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #message{min-height:24px;margin:12px 0 0;color:#be123c;font-size:14px}
    .hint{margin-top:12px;font-size:13px}
  </style>
</head>
<body>
  <main>
    <h1>الاتصال بالخادم المركزي</h1>
    <p>أدخل عنوان جهاز الخادم على الشبكة. ستظل البيانات وقاعدة البيانات محفوظة على الخادم المركزي، وليس على هذا الجهاز.</p>
    <form id="connectionForm">
      <label for="serverUrl">عنوان الخادم</label>
      <input id="serverUrl" type="url" placeholder="http://192.168.1.10:3000" autocomplete="url" required/>
      <button id="saveButton" type="submit">اتصال وحفظ الإعداد</button>
      <div id="message" role="alert" aria-live="polite"></div>
    </form>
    <p class="hint">يمكن تغيير العنوان لاحقًا من قائمة «التطبيق» ثم «تغيير عنوان الخادم».</p>
  </main>
  <script src="./connection.js"></script>
</body>
</html>
